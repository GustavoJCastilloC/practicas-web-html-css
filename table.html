<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Link</title>
        <style> 
        table {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
        }
        
        td, th {
            border: 1px solid black;
            padding: 10px;
        }
        </style>
    </head>
    <body>
        <table> 
            <thead> <!-- Note: <thead> = table head, which contains the header row of the table. -->
                <tr>
                    <th>Ocean</th>
                    <th>Average Depth</th>
                    <th>Maximum Depth</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Pacific Ocean</td> <!-- Note: <td> = table data, which contains the data for each cell in the table. -->
                    <td>4,280 m</td>
                    <td>10,911 m</td>
                </tr>
                <tr>
                    <td>Atlantic Ocean</td> <!-- Note: <td> = table data, which contains the data for each cell in the table. -->
                    <td>3,6460 m</td>
                    <td>8,486 m</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
