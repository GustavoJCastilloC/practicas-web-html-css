<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hello!</title>
        <style>
            a {
                color: blue;
            }

            a[href="https://facebook.com"] {
                color: red;
                font-weight: bold;
            }
            /*los corchetes se utilizan para seleccionar elementos que tienen un atributo específico con un valor determinado. En este caso, se selecciona el elemento <A> que tiene un atributo "href" con el valor "http://facebook.com". */
        </style>
    </head>
    <body>
        <ul>
            <li><a href="https://google.com">Google</a></li>
            <li><a href="https://facebook.com">Facebook</a></li>
            <li><a href="https://amazon.com">Amazon</a></li>
        </ul>
    </body>
</html>
